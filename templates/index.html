<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>TeleRelay • Modern Restricted Media Streamer</title>
  <link rel="manifest" href="/static/manifest.json">
  <meta name="theme-color" content="#090d16">
  <link rel="apple-touch-icon" href="/static/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #090d16;
      --surface: rgba(18, 25, 43, 0.7);
      --surface-border: rgba(255, 255, 255, 0.08);
      --surface-hover: rgba(30, 41, 69, 0.8);
      --primary: #3b82f6;
      --primary-glow: rgba(59, 130, 246, 0.35);
      --accent: #10b981;
      --accent-glow: rgba(16, 185, 129, 0.35);
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --warning: #f59e0b;
      --danger: #ef4444;
      --radius: 16px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    body {
      font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
      background: radial-gradient(circle at 50% 0%, #1e1b4b 0%, var(--bg) 60%);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    /* Ambient Background Glow */
    .ambient-glow {
      position: fixed;
      width: 400px;
      height: 400px;
      border-radius: 50%;
      background: radial-gradient(circle, var(--primary-glow) 0%, transparent 70%);
      top: -100px;
      right: -100px;
      pointer-events: none;
      z-index: 0;
      opacity: 0.6;
      animation: floatGlow 12s ease-in-out infinite alternate;
    }
    @keyframes floatGlow {
      from { transform: translate(0, 0) scale(1); }
      to { transform: translate(-40px, 40px) scale(1.15); }
    }

    /* Header */
    header {
      background: rgba(9, 13, 22, 0.75);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--surface-border);
      padding: 14px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 50;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      font-weight: 800;
      font-size: 1.15rem;
      letter-spacing: -0.02em;
    }
    .brand-icon {
      background: linear-gradient(135deg, #3b82f6, #8b5cf6);
      width: 36px;
      height: 36px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
      box-shadow: 0 4px 14px var(--primary-glow);
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .user-pill {
      font-size: 0.8rem;
      background: rgba(56, 189, 248, 0.1);
      color: #38bdf8;
      border: 1px solid rgba(56, 189, 248, 0.25);
      padding: 6px 14px;
      border-radius: 30px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .online-dot {
      width: 7px;
      height: 7px;
      background: #10b981;
      border-radius: 50%;
      box-shadow: 0 0 8px #10b981;
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(0.85); }
    }

    #pwa-install-btn {
      display: none;
      background: linear-gradient(135deg, #10b981, #059669);
      color: white;
      border: none;
      padding: 6px 14px;
      border-radius: 30px;
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 12px var(--accent-glow);
      transition: transform 0.15s ease;
    }
    #pwa-install-btn:active { transform: scale(0.96); }

    /* Layout */
    main {
      flex: 1;
      max-width: 860px;
      width: 100%;
      margin: 0 auto;
      padding: 20px 16px;
      display: flex;
      flex-direction: column;
      gap: 18px;
      position: relative;
      z-index: 1;
    }

    /* Glass Cards */
    .glass-card {
      background: var(--surface);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--surface-border);
      border-radius: var(--radius);
      padding: 20px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
      transition: border-color 0.2s ease;
    }
    .glass-card:hover {
      border-color: rgba(255, 255, 255, 0.14);
    }

    /* Chat Selector Trigger */
    .chat-trigger {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(10, 15, 28, 0.8);
      border: 1px solid var(--surface-border);
      border-radius: 12px;
      padding: 14px 18px;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .chat-trigger:hover {
      background: var(--surface-hover);
      border-color: var(--primary);
    }
    .chat-trigger-info {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .avatar-circle {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      background: linear-gradient(135deg, #6366f1, #3b82f6);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 1.1rem;
      color: white;
    }
    .trigger-text-title {
      font-weight: 700;
      font-size: 1rem;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .trigger-text-sub {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: 2px;
    }

    /* Modal / Drawer for Chat Selection */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(10px);
      z-index: 100;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      animation: fadeIn 0.2s ease;
    }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

    .modal-box {
      background: #12192b;
      border: 1px solid var(--surface-border);
      border-radius: 20px;
      width: 100%;
      max-width: 560px;
      max-height: 82vh;
      display: flex;
      flex-direction: column;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
      animation: slideUp 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      overflow: hidden;
    }
    @keyframes slideUp {
      from { transform: translateY(30px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    .modal-header {
      padding: 18px 20px;
      border-bottom: 1px solid var(--surface-border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .modal-title {
      font-size: 1.1rem;
      font-weight: 700;
    }
    .close-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 1.4rem;
      cursor: pointer;
      line-height: 1;
      padding: 4px;
    }

    /* Category Filter Pills */
    .filter-pills {
      display: flex;
      gap: 8px;
      padding: 12px 20px;
      overflow-x: auto;
      border-bottom: 1px solid var(--surface-border);
    }
    .pill {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--surface-border);
      color: var(--text-muted);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.15s ease;
    }
    .pill.active {
      background: var(--primary);
      color: white;
      border-color: var(--primary);
      box-shadow: 0 2px 10px var(--primary-glow);
    }

    .modal-search {
      padding: 14px 20px 8px;
    }
    .search-input {
      width: 100%;
      background: #090d16;
      border: 1px solid var(--surface-border);
      border-radius: 12px;
      padding: 12px 16px;
      color: var(--text);
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s ease;
    }
    .search-input:focus {
      border-color: var(--primary);
    }

    .chat-list {
      flex: 1;
      overflow-y: auto;
      padding: 10px 14px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .chat-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 14px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid transparent;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .chat-item:hover {
      background: rgba(255, 255, 255, 0.06);
      border-color: rgba(255, 255, 255, 0.1);
      transform: translateX(4px);
    }
    .chat-item-info {
      flex: 1;
      min-width: 0;
    }
    .chat-item-title {
      font-weight: 600;
      font-size: 0.92rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .chat-item-type {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-top: 2px;
    }
    .badge-lock {
      background: rgba(245, 158, 11, 0.15);
      color: #f59e0b;
      border: 1px solid rgba(245, 158, 11, 0.3);
      padding: 2px 8px;
      border-radius: 12px;
      font-size: 0.72rem;
      font-weight: 700;
    }

    /* Media Feed */
    .feed-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 16px;
    }
    .feed-title {
      font-size: 1.05rem;
      font-weight: 800;
      letter-spacing: -0.01em;
    }

    /* Batch Controls */
    .batch-bar {
      background: rgba(59, 130, 246, 0.08);
      border: 1px solid rgba(59, 130, 246, 0.2);
      border-radius: 12px;
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
      flex-wrap: wrap;
      gap: 10px;
    }

    /* Buttons */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: var(--primary);
      color: white;
      border: none;
      padding: 10px 18px;
      border-radius: 10px;
      font-weight: 700;
      font-size: 0.88rem;
      cursor: pointer;
      transition: all 0.15s ease;
      touch-action: manipulation;
    }
    .btn:active { transform: scale(0.97); }
    .btn-accent {
      background: linear-gradient(135deg, #10b981, #059669);
      box-shadow: 0 4px 14px var(--accent-glow);
    }
    .btn-accent:hover { opacity: 0.95; }
    .btn-secondary {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--surface-border);
      color: var(--text);
    }
    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.14);
    }
    .btn-sm {
      padding: 7px 14px;
      font-size: 0.8rem;
      border-radius: 8px;
    }

    /* Media List Items */
    .msg-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-height: 580px;
      overflow-y: auto;
      padding-right: 4px;
    }
    .msg-card {
      background: rgba(14, 21, 38, 0.6);
      border: 1px solid var(--surface-border);
      border-radius: 14px;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      gap: 14px;
      transition: all 0.2s ease;
      animation: cardFadeIn 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }
    @keyframes cardFadeIn {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .msg-card:hover {
      background: rgba(20, 30, 55, 0.75);
      border-color: rgba(255, 255, 255, 0.15);
      transform: translateY(-2px);
    }

    .msg-checkbox {
      width: 20px;
      height: 20px;
      cursor: pointer;
      accent-color: var(--primary);
    }

    .media-icon-box {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.25rem;
      background: rgba(59, 130, 246, 0.12);
      border: 1px solid rgba(59, 130, 246, 0.25);
    }
    .media-icon-box.audio { background: rgba(245, 158, 11, 0.12); border-color: rgba(245, 158, 11, 0.25); }
    .media-icon-box.video { background: rgba(139, 92, 246, 0.12); border-color: rgba(139, 92, 246, 0.25); }

    .msg-body {
      flex: 1;
      min-width: 0;
    }
    .msg-title {
      font-weight: 700;
      font-size: 0.92rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .msg-meta {
      font-size: 0.78rem;
      color: var(--text-muted);
      margin-top: 4px;
      display: flex;
      gap: 10px;
      align-items: center;
    }
    .type-tag {
      font-size: 0.7rem;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 4px;
      background: rgba(255, 255, 255, 0.08);
    }

    /* Toast Notification */
    #status-toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(18, 25, 43, 0.95);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--primary);
      box-shadow: 0 12px 36px rgba(0, 0, 0, 0.7), 0 0 20px var(--primary-glow);
      padding: 14px 26px;
      border-radius: 40px;
      display: none;
      align-items: center;
      gap: 12px;
      font-size: 0.92rem;
      font-weight: 600;
      z-index: 200;
      max-width: 90vw;
      animation: toastPop 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }
    @keyframes toastPop {
      from { transform: translate(-50%, 20px) scale(0.9); opacity: 0; }
      to { transform: translate(-50%, 0) scale(1); opacity: 1; }
    }

    .spinner {
      width: 20px;
      height: 20px;
      border: 3px solid rgba(59, 130, 246, 0.3);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Custom Scrollbar */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.15); border-radius: 6px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.3); }
  </style>
</head>
<body>

  <div class="ambient-glow"></div>

  <header>
    <div class="brand">
      <div class="brand-icon">⚡</div>
      <span>TeleRelay</span>
    </div>
    <div class="header-actions">
      <button id="pwa-install-btn" onclick="installPWA()">📲 Install App</button>
      <div class="user-pill" id="user-display">
        <div class="online-dot"></div>
        <span id="user-name-text">Connecting...</span>
      </div>
    </div>
  </header>

  <main>
    <!-- Chat Selector Trigger -->
    <div class="glass-card" style="padding: 16px;">
      <div style="font-size: 0.8rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase; margin-bottom: 8px;">Active Channel / Bot</div>
      <div class="chat-trigger" onclick="openChatModal()">
        <div class="chat-trigger-info">
          <div class="avatar-circle" id="selected-avatar">💬</div>
          <div>
            <div class="trigger-text-title" id="selected-title">Tap to Choose Chat / Channel</div>
            <div class="trigger-text-sub" id="selected-subtitle">Browse restricted channels, bots, or groups</div>
          </div>
        </div>
        <div style="font-size: 1.1rem; color: var(--text-muted);">❯</div>
      </div>
    </div>

    <!-- Messages / Media Container -->
    <div class="glass-card" id="messages-card" style="display: none;">
      <div class="feed-header">
        <div>
          <div class="feed-title" id="feed-title">Channel Media</div>
          <div style="font-size: 0.8rem; color: var(--text-muted); margin-top: 2px;">
            <span id="file-counter">0</span> files loaded
          </div>
        </div>
        <div style="display:flex; gap: 8px;">
          <button class="btn btn-secondary btn-sm" onclick="reloadFromStart()">🔄 Refresh</button>
        </div>
      </div>

      <!-- Real-time Media Search -->
      <div style="margin-bottom: 12px;">
        <input type="text" id="search-input" class="search-input" placeholder="🔍 Search episode, title, or filename..." oninput="debounceSearch()">
      </div>

      <!-- Batch Actions Bar -->
      <div class="batch-bar" id="batch-bar">
        <label style="display:flex; align-items:center; gap: 8px; font-size: 0.88rem; font-weight: 600; cursor: pointer;">
          <input type="checkbox" id="select-all-cb" style="width: 18px; height: 18px; accent-color: var(--primary);" onchange="toggleSelectAll(this.checked)">
          Select All (<span id="selected-count">0</span>)
        </label>
        <button class="btn btn-accent btn-sm" id="btn-batch-send" onclick="forwardSelected()" style="opacity: 0.45;" disabled>
          ⏩ Forward Selected to Saved
        </button>
      </div>

      <!-- Live Media Cards Feed -->
      <div class="msg-list" id="msg-list"></div>

      <!-- Load More Button -->
      <div style="text-align: center; margin-top: 16px;" id="load-more-container" style="display: none;">
        <button class="btn btn-secondary" id="btn-load-more" onclick="loadMoreMessages()" style="width: 100%;">
          ⬇ Load Next 50 Files
        </button>
      </div>
    </div>
  </main>

  <!-- Modern Chat Picker Modal -->
  <div class="modal-overlay" id="chat-modal" onclick="closeChatModalOnBackdrop(event)">
    <div class="modal-box">
      <div class="modal-header">
        <div class="modal-title">Select Channel or Bot</div>
        <button class="close-btn" onclick="closeChatModal()">✕</button>
      </div>

      <!-- Filter Pills -->
      <div class="filter-pills">
        <div class="pill active" onclick="setFilter('all', this)">All Chats (<span id="count-all">0</span>)</div>
        <div class="pill" onclick="setFilter('restricted', this)">🔒 Restricted (<span id="count-restricted">0</span>)</div>
        <div class="pill" onclick="setFilter('channel', this)">📢 Channels (<span id="count-channels">0</span>)</div>
        <div class="pill" onclick="setFilter('bot', this)">🤖 Bots (<span id="count-bots">0</span>)</div>
      </div>

      <!-- Modal Search Bar -->
      <div class="modal-search">
        <input type="text" id="modal-chat-search" class="search-input" placeholder="Search chats by name..." oninput="filterChats()">
      </div>

      <!-- Chat Items List -->
      <div class="chat-list" id="chat-list-container">
        <div style="text-align: center; padding: 30px; color: var(--text-muted);">Loading chats...</div>
      </div>
    </div>
  </div>

  <!-- Toast Notification -->
  <div id="status-toast">
    <div class="spinner"></div>
    <span id="toast-text">Streaming directly to Saved Messages...</span>
  </div>

  <script>
    let rawChats = [];
    let currentFilter = 'all';
    let currentChatId = null;
    let nextOffsetId = 0;
    let allLoadedMessages = [];
    let searchDebounceTimer = null;
    let deferredPrompt = null;

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/static/sw.js');
    }

    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      document.getElementById('pwa-install-btn').style.display = 'block';
    });

    async function installPWA() {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        const { outcome } = await deferredPrompt.userChoice;
        if (outcome === 'accepted') {
          document.getElementById('pwa-install-btn').style.display = 'none';
        }
        deferredPrompt = null;
      }
    }

    async function init() {
      try {
        const res = await fetch('/api/status');
        const data = await res.json();
        if (data.user) {
          document.getElementById('user-name-text').innerText = data.user;
        } else {
          document.getElementById('user-name-text').innerText = 'Offline';
        }
        await fetchChats();
      } catch (err) {
        document.getElementById('user-name-text').innerText = 'Error connecting';
      }
    }

    async function fetchChats() {
      try {
        const res = await fetch('/api/chats');
        rawChats = await res.json();
        
        // Count categories
        document.getElementById('count-all').innerText = rawChats.length;
        document.getElementById('count-restricted').innerText = rawChats.filter(c => c.restricted).length;
        document.getElementById('count-channels').innerText = rawChats.filter(c => c.type === 'Channel' || c.type === 'Supergroup').length;
        document.getElementById('count-bots').innerText = rawChats.filter(c => c.type === 'User').length;

        renderChatList();
      } catch (e) {
        document.getElementById('chat-list-container').innerHTML = '<div style="text-align:center; padding: 20px; color: var(--danger);">Failed to load chats</div>';
      }
    }

    function renderChatList() {
      const container = document.getElementById('chat-list-container');
      const search = (document.getElementById('modal-chat-search').value || '').toLowerCase();

      const filtered = rawChats.filter(c => {
        const matchSearch = c.title.toLowerCase().includes(search);
        if (!matchSearch) return false;
        if (currentFilter === 'restricted') return c.restricted;
        if (currentFilter === 'channel') return c.type === 'Channel' || c.type === 'Supergroup';
        if (currentFilter === 'bot') return c.type === 'User';
        return true;
      });

      if (filtered.length === 0) {
        container.innerHTML = '<div style="text-align:center; padding: 30px; color: var(--text-muted);">No chats match your filter</div>';
        return;
      }

      container.innerHTML = '';
      filtered.forEach(c => {
        const item = document.createElement('div');
        item.className = 'chat-item';
        item.onclick = () => selectChat(c);

        const firstLetter = (c.title || '?').charAt(0).toUpperCase();
        item.innerHTML = `
          <div class="avatar-circle" style="width: 38px; height: 38px; font-size: 0.95rem;">${firstLetter}</div>
          <div class="chat-item-info">
            <div class="chat-item-title">
              <span>${c.title}</span>
              ${c.restricted ? '<span class="badge-lock">🔒 Restricted</span>' : ''}
            </div>
            <div class="chat-item-type">${c.type}</div>
          </div>
        `;
        container.appendChild(item);
      });
    }

    function setFilter(filterType, pillEl) {
      currentFilter = filterType;
      document.querySelectorAll('.filter-pills .pill').forEach(p => p.classList.remove('active'));
      pillEl.classList.add('active');
      renderChatList();
    }

    function filterChats() {
      renderChatList();
    }

    function openChatModal() {
      document.getElementById('chat-modal').style.display = 'flex';
      document.getElementById('modal-chat-search').focus();
    }

    function closeChatModal() {
      document.getElementById('chat-modal').style.display = 'none';
    }

    function closeChatModalOnBackdrop(e) {
      if (e.target.id === 'chat-modal') closeChatModal();
    }

    function selectChat(chat) {
      currentChatId = chat.id;
      document.getElementById('selected-avatar').innerText = (chat.title || '?').charAt(0).toUpperCase();
      document.getElementById('selected-title').innerHTML = `${chat.title} ${chat.restricted ? '<span class="badge-lock" style="font-size:0.7rem;">🔒 Restricted</span>' : ''}`;
      document.getElementById('selected-subtitle').innerText = `${chat.type} • ID: ${chat.id}`;
      document.getElementById('feed-title').innerText = chat.title;
      closeChatModal();
      document.getElementById('messages-card').style.display = 'block';
      reloadFromStart();
    }

    async function reloadFromStart() {
      nextOffsetId = 0;
      allLoadedMessages = [];
      document.getElementById('msg-list').innerHTML = '';
      document.getElementById('select-all-cb').checked = false;
      updateSelectedCount();
      await fetchMessagesBatch();
    }

    function debounceSearch() {
      clearTimeout(searchDebounceTimer);
      searchDebounceTimer = setTimeout(() => {
        reloadFromStart();
      }, 400);
    }

    async function fetchMessagesBatch() {
      showToast('Fetching media list...');
      const search = document.getElementById('search-input').value.trim();
      const loadBtn = document.getElementById('btn-load-more');
      loadBtn.disabled = true;

      try {
        const res = await fetch(`/api/messages?chat_id=${currentChatId}&limit=50&offset_id=${nextOffsetId}&search=${encodeURIComponent(search)}`);
        const data = await res.json();
        
        const newItems = data.messages || [];
        nextOffsetId = data.next_offset_id || 0;
        
        newItems.forEach(item => {
          if (!allLoadedMessages.some(m => m.id === item.id)) {
            allLoadedMessages.push(item);
            appendMessageCard(item);
          }
        });

        document.getElementById('file-counter').innerText = allLoadedMessages.length;
        document.getElementById('load-more-container').style.display = (data.has_more && nextOffsetId > 0) ? 'block' : 'none';

        if (allLoadedMessages.length === 0) {
          document.getElementById('msg-list').innerHTML = '<div style="text-align:center; color: var(--text-muted); padding: 40px;">No media files found</div>';
        }
      } catch (err) {
        alert('Failed to load media');
      } finally {
        loadBtn.disabled = false;
        hideToast();
      }
    }

    function getMediaIcon(type) {
      if (type === 'audio') return '🎵';
      if (type === 'video') return '🎬';
      if (type === 'photo') return '🖼️';
      return '📄';
    }

    function appendMessageCard(m) {
      const list = document.getElementById('msg-list');
      const item = document.createElement('div');
      item.className = 'msg-card';
      item.id = `card-${m.id}`;
      item.innerHTML = `
        <input type="checkbox" class="msg-checkbox" value="${m.id}" onchange="updateSelectedCount()">
        <div class="media-icon-box ${m.type}">${getMediaIcon(m.type)}</div>
        <div class="msg-body">
          <div class="msg-title" title="${m.filename}">${m.filename}</div>
          <div class="msg-meta">
            <span class="type-tag">${m.type.toUpperCase()}</span>
            <span>${m.size}</span>
            <span>${m.date}</span>
          </div>
        </div>
        <button class="btn btn-sm btn-accent" onclick="forwardSingle(${m.id})">
          📤 Send
        </button>
      `;
      list.appendChild(item);
    }

    function loadMoreMessages() {
      fetchMessagesBatch();
    }

    function toggleSelectAll(isChecked) {
      const checkboxes = document.querySelectorAll('.msg-checkbox');
      checkboxes.forEach(cb => cb.checked = isChecked);
      updateSelectedCount();
    }

    function updateSelectedCount() {
      const selected = document.querySelectorAll('.msg-checkbox:checked');
      document.getElementById('selected-count').innerText = selected.length;
      const btn = document.getElementById('btn-batch-send');
      if (selected.length > 0) {
        btn.disabled = false;
        btn.style.opacity = '1';
        btn.innerText = `⏩ Forward ${selected.length} to Saved`;
      } else {
        btn.disabled = true;
        btn.style.opacity = '0.45';
        btn.innerText = '⏩ Forward Selected to Saved';
      }
    }

    function showToast(text) {
      const t = document.getElementById('status-toast');
      document.getElementById('toast-text').innerText = text;
      t.style.display = 'flex';
    }

    function hideToast() {
      document.getElementById('status-toast').style.display = 'none';
    }

    async function forwardSingle(msgId) {
      showToast(`Streaming msg ${msgId} directly to Saved Messages...`);
      try {
        const res = await fetch('/api/forward', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({
            source_chat: currentChatId,
            message_ids: [msgId]
          })
        });
        const resData = await res.json();
        if (resData.success) {
          showToast('✅ Sent to Saved Messages!');
          setTimeout(hideToast, 2000);
        } else {
          alert('❌ Failed: ' + (resData.error || 'Unknown error'));
          hideToast();
        }
      } catch (e) {
        alert('Network error while forwarding');
        hideToast();
      }
    }

    async function forwardSelected() {
      const checked = Array.from(document.querySelectorAll('.msg-checkbox:checked')).map(cb => parseInt(cb.value));
      if (checked.length === 0) return;
      if (!confirm(`Stream ${checked.length} files directly to Saved Messages in RAM?`)) return;

      showToast(`Streaming ${checked.length} files to Saved Messages...`);
      try {
        const res = await fetch('/api/forward', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({
            source_chat: currentChatId,
            message_ids: checked
          })
        });
        const resData = await res.json();
        if (resData.success) {
          showToast(`✅ Successfully forwarded ${resData.count} files!`);
          document.querySelectorAll('.msg-checkbox:checked').forEach(cb => cb.checked = false);
          document.getElementById('select-all-cb').checked = false;
          updateSelectedCount();
          setTimeout(hideToast, 2500);
        } else {
          alert('❌ Failed: ' + (resData.error || 'Unknown error'));
          hideToast();
        }
      } catch (e) {
        alert('Network error while batch forwarding');
        hideToast();
      }
    }

    window.onload = init;
  </script>
</body>
</html>
