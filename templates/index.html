<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>TeleRelay</title>
  <link rel="manifest" href="/static/manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0b0e14">
  <link rel="apple-touch-icon" href="/static/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0b0e14;
      --bg-elevated: #131924;
      --surface: rgba(23, 31, 46, 0.75);
      --surface-border: rgba(255, 255, 255, 0.08);
      --surface-hover: rgba(32, 43, 63, 0.9);
      --tg-blue: #2AABEE;
      --tg-blue-hover: #229ED9;
      --tg-gradient: linear-gradient(135deg, #2AABEE, #229ED9 50%, #0088cc);
      --accent-green: #10b981;
      --accent-gold: #f59e0b;
      --text: #ffffff;
      --text-sub: #94a3b8;
      --text-muted: #64748b;
      --radius-sm: 12px;
      --radius-md: 18px;
      --radius-lg: 24px;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      min-height: -webkit-fill-available;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
      padding-top: var(--safe-top);
      padding-bottom: calc(var(--safe-bottom) + 90px);
    }

    /* Ambient Lighting */
    .ambient-mesh {
      position: fixed;
      top: -20%;
      left: 50%;
      transform: translateX(-50%);
      width: 140vw;
      height: 450px;
      background: radial-gradient(ellipse at 50% 30%, rgba(42, 171, 238, 0.15) 0%, rgba(139, 92, 246, 0.08) 40%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    /* Top App Bar */
    .app-header {
      position: sticky;
      top: 0;
      z-index: 40;
      background: rgba(11, 14, 20, 0.82);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--surface-border);
      padding: 12px 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .brand-icon {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background: var(--tg-gradient);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.15rem;
      box-shadow: 0 4px 16px rgba(42, 171, 238, 0.35);
    }
    .brand-title {
      font-weight: 800;
      font-size: 1.1rem;
      letter-spacing: -0.02em;
      background: linear-gradient(135deg, #ffffff 40%, #94a3b8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .header-status {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--surface-border);
      padding: 6px 12px;
      border-radius: 30px;
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--tg-blue);
    }
    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--accent-green);
      box-shadow: 0 0 10px var(--accent-green);
      animation: pulseGreen 2s infinite;
    }
    @keyframes pulseGreen {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(0.8); opacity: 0.6; }
    }

    /* Main Container */
    .app-body {
      max-width: 680px;
      width: 100%;
      margin: 0 auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      position: relative;
      z-index: 1;
    }

    /* Chat Selection Card */
    .chat-card {
      background: var(--surface);
      border: 1px solid var(--surface-border);
      border-radius: var(--radius-md);
      padding: 14px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .chat-card:active {
      transform: scale(0.98);
      background: var(--surface-hover);
    }
    .chat-card-left {
      display: flex;
      align-items: center;
      gap: 14px;
      min-width: 0;
    }
    .chat-avatar {
      width: 48px;
      height: 48px;
      border-radius: 14px;
      background: var(--tg-gradient);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.25rem;
      font-weight: 800;
      color: white;
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.3);
      flex-shrink: 0;
    }
    .chat-info {
      min-width: 0;
    }
    .chat-label {
      font-size: 0.72rem;
      font-weight: 700;
      color: var(--tg-blue);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 2px;
    }
    .chat-title-text {
      font-weight: 700;
      font-size: 0.98rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .chat-sub-text {
      font-size: 0.78rem;
      color: var(--text-sub);
      margin-top: 2px;
    }
    .chevron-icon {
      color: var(--text-muted);
      font-size: 1.2rem;
      padding-left: 10px;
    }

    /* Badges */
    .badge-lock {
      background: rgba(245, 158, 11, 0.15);
      color: #fbbf24;
      border: 1px solid rgba(245, 158, 11, 0.35);
      padding: 2px 7px;
      border-radius: 20px;
      font-size: 0.68rem;
      font-weight: 700;
    }

    /* Feed Controls */
    .search-pill-box {
      position: relative;
      margin-top: 4px;
    }
    .search-input {
      width: 100%;
      background: rgba(19, 25, 36, 0.85);
      border: 1px solid var(--surface-border);
      border-radius: var(--radius-sm);
      padding: 12px 16px 12px 42px;
      color: var(--text);
      font-size: 0.92rem;
      font-family: inherit;
      outline: none;
      transition: all 0.2s ease;
      user-select: text;
      -webkit-user-select: text;
    }
    .search-input:focus {
      border-color: var(--tg-blue);
      box-shadow: 0 0 16px rgba(42, 171, 238, 0.2);
    }
    .search-icon-svg {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      width: 18px;
      height: 18px;
      fill: var(--text-muted);
      pointer-events: none;
    }

    /* Media List */
    .feed-container {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 4px;
    }
    .feed-header-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 4px;
    }
    .feed-counter {
      font-size: 0.82rem;
      color: var(--text-sub);
      font-weight: 600;
    }
    .btn-select-all {
      background: none;
      border: none;
      color: var(--tg-blue);
      font-size: 0.82rem;
      font-weight: 700;
      cursor: pointer;
      padding: 4px 6px;
    }

    /* Media Item Card */
    .media-card {
      background: var(--surface);
      border: 1.5px solid var(--surface-border);
      border-radius: var(--radius-md);
      padding: 12px 14px;
      display: flex;
      align-items: center;
      gap: 14px;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }
    .media-card:active {
      transform: scale(0.985);
    }
    .media-card.selected {
      border-color: var(--tg-blue);
      background: rgba(42, 171, 238, 0.12);
      box-shadow: 0 4px 18px rgba(42, 171, 238, 0.15);
    }

    .check-circle {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      border: 2px solid var(--text-muted);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .media-card.selected .check-circle {
      background: var(--tg-blue);
      border-color: var(--tg-blue);
    }
    .check-circle svg {
      width: 14px;
      height: 14px;
      fill: none;
      stroke: white;
      stroke-width: 3;
      stroke-linecap: round;
      stroke-linejoin: round;
      opacity: 0;
      transform: scale(0.5);
      transition: all 0.15s ease;
    }
    .media-card.selected .check-circle svg {
      opacity: 1;
      transform: scale(1);
    }

    .media-type-icon {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.3rem;
      flex-shrink: 0;
    }
    .media-type-icon.audio { background: rgba(245, 158, 11, 0.14); border: 1px solid rgba(245, 158, 11, 0.3); }
    .media-type-icon.video { background: rgba(139, 92, 246, 0.14); border: 1px solid rgba(139, 92, 246, 0.3); }
    .media-type-icon.photo { background: rgba(16, 185, 129, 0.14); border: 1px solid rgba(16, 185, 129, 0.3); }
    .media-type-icon.file { background: rgba(59, 130, 246, 0.14); border: 1px solid rgba(59, 130, 246, 0.3); }

    .media-meta-wrap {
      flex: 1;
      min-width: 0;
    }
    .media-title {
      font-weight: 700;
      font-size: 0.92rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: #f1f5f9;
    }
    .media-info-row {
      font-size: 0.76rem;
      color: var(--text-sub);
      margin-top: 3px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .tag-badge {
      background: rgba(255, 255, 255, 0.08);
      padding: 1px 6px;
      border-radius: 4px;
      font-weight: 700;
      font-size: 0.68rem;
    }

    .btn-quick-send {
      background: var(--tg-gradient);
      color: white;
      border: none;
      padding: 8px 12px;
      border-radius: 10px;
      font-size: 0.78rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(42, 171, 238, 0.3);
      flex-shrink: 0;
      transition: transform 0.15s ease;
    }
    .btn-quick-send:active { transform: scale(0.94); }

    /* Floating Dock at Bottom (Mobile Native UX) */
    .floating-dock {
      position: fixed;
      bottom: calc(var(--safe-bottom) + 14px);
      left: 16px;
      right: 16px;
      max-width: 648px;
      margin: 0 auto;
      z-index: 50;
      background: rgba(19, 25, 36, 0.92);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 20px;
      padding: 10px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.7), 0 0 24px rgba(42, 171, 238, 0.2);
      transform: translateY(120%);
      transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .floating-dock.visible {
      transform: translateY(0);
    }
    .dock-left-count {
      display: flex;
      flex-direction: column;
    }
    .dock-title {
      font-size: 0.88rem;
      font-weight: 800;
    }
    .dock-sub {
      font-size: 0.72rem;
      color: var(--text-sub);
    }
    .dock-btn {
      background: var(--tg-gradient);
      color: white;
      border: none;
      padding: 12px 20px;
      border-radius: 14px;
      font-weight: 800;
      font-size: 0.92rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 4px 16px rgba(42, 171, 238, 0.4);
      transition: transform 0.15s ease;
    }
    .dock-btn:active { transform: scale(0.96); }

    /* Modern Bottom Sheet / Drawer for Chat Picker */
    .sheet-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      z-index: 100;
      display: none;
      align-items: flex-end;
      justify-content: center;
      animation: fadeIn 0.2s ease;
    }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

    .bottom-sheet {
      background: #111722;
      border-top: 1px solid var(--surface-border);
      border-radius: 26px 26px 0 0;
      width: 100%;
      max-width: 680px;
      max-height: 84vh;
      display: flex;
      flex-direction: column;
      box-shadow: 0 -10px 40px rgba(0, 0, 0, 0.8);
      animation: sheetUp 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      padding-bottom: calc(var(--safe-bottom) + 12px);
    }
    @keyframes sheetUp {
      from { transform: translateY(100%); }
      to { transform: translateY(0); }
    }

    .sheet-grabber {
      width: 40px;
      height: 4px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 4px;
      margin: 12px auto 6px;
    }

    .sheet-head {
      padding: 10px 20px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .sheet-title {
      font-weight: 800;
      font-size: 1.15rem;
    }
    .sheet-close {
      background: rgba(255, 255, 255, 0.08);
      border: none;
      color: var(--text-sub);
      width: 32px;
      height: 32px;
      border-radius: 50%;
      font-size: 1.1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Filter Tabs in Sheet */
    .sheet-tabs {
      display: flex;
      gap: 8px;
      padding: 0 18px 12px;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .sheet-tabs::-webkit-scrollbar { display: none; }
    .tab-pill {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--surface-border);
      color: var(--text-sub);
      padding: 6px 14px;
      border-radius: 30px;
      font-size: 0.78rem;
      font-weight: 700;
      white-space: nowrap;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .tab-pill.active {
      background: var(--tg-gradient);
      color: white;
      border-color: var(--tg-blue);
      box-shadow: 0 2px 12px rgba(42, 171, 238, 0.35);
    }

    .sheet-search-wrap {
      padding: 0 18px 10px;
    }

    .sheet-scroll-list {
      flex: 1;
      overflow-y: auto;
      padding: 4px 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .sheet-chat-item {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid transparent;
      border-radius: 14px;
      padding: 12px 14px;
      display: flex;
      align-items: center;
      gap: 14px;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .sheet-chat-item:active {
      background: rgba(42, 171, 238, 0.15);
      border-color: var(--tg-blue);
      transform: scale(0.985);
    }
    .sheet-chat-avatar {
      width: 44px;
      height: 44px;
      border-radius: 13px;
      background: var(--tg-gradient);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 1.1rem;
      color: white;
      flex-shrink: 0;
    }
    .sheet-chat-title {
      font-weight: 700;
      font-size: 0.95rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .sheet-chat-sub {
      font-size: 0.76rem;
      color: var(--text-sub);
      margin-top: 2px;
    }

    /* Modern Toast */
    .mobile-toast {
      position: fixed;
      top: calc(var(--safe-top) + 20px);
      left: 18px;
      right: 18px;
      max-width: 500px;
      margin: 0 auto;
      background: rgba(17, 24, 39, 0.94);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--tg-blue);
      border-radius: 16px;
      padding: 14px 18px;
      display: none;
      align-items: center;
      gap: 12px;
      font-size: 0.88rem;
      font-weight: 600;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7), 0 0 20px rgba(42, 171, 238, 0.25);
      z-index: 200;
      animation: toastDrop 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }
    @keyframes toastDrop {
      from { transform: translateY(-30px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
    .toast-spinner {
      width: 18px;
      height: 18px;
      border: 2px solid rgba(42, 171, 238, 0.3);
      border-top-color: var(--tg-blue);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      flex-shrink: 0;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Load More Button */
    .btn-load-more {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--surface-border);
      color: var(--text);
      padding: 14px;
      border-radius: var(--radius-sm);
      font-size: 0.88rem;
      font-weight: 700;
      cursor: pointer;
      margin-top: 10px;
      transition: all 0.2s ease;
    }
    .btn-load-more:active {
      background: var(--surface-hover);
      transform: scale(0.98);
    }
  </style>
</head>
<body>

  <div class="ambient-mesh"></div>

  <!-- Top Header -->
  <header class="app-header">
    <div class="brand-wrap">
      <div class="brand-icon">⚡</div>
      <span class="brand-title">TeleRelay</span>
    </div>
    <div class="header-status">
      <div class="status-dot"></div>
      <span id="user-status-text">Connected</span>
    </div>
  </header>

  <!-- Main Body -->
  <main class="app-body">
    <!-- Active Chat Banner -->
    <div class="chat-card" onclick="openDrawer()">
      <div class="chat-card-left">
        <div class="chat-avatar" id="active-chat-avatar">💬</div>
        <div class="chat-info">
          <div class="chat-label">Channel / Chat</div>
          <div class="chat-title-text" id="active-chat-title">Select a Chat or Bot</div>
          <div class="chat-sub-text" id="active-chat-sub">Tap here to pick from your channels</div>
        </div>
      </div>
      <div class="chevron-icon">❯</div>
    </div>

    <!-- Feed Section -->
    <div id="media-feed-wrapper" style="display: none;">
      <!-- Search Input -->
      <div class="search-pill-box">
        <svg class="search-icon-svg" viewBox="0 0 24 24">
          <path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
        </svg>
        <input type="text" id="media-search-input" class="search-input" placeholder="Search episode or file name..." oninput="onSearchChanged()">
      </div>

      <!-- Feed Header -->
      <div class="feed-header-row" style="margin-top: 14px;">
        <span class="feed-counter" id="feed-counter-label">0 files loaded</span>
        <button class="btn-select-all" onclick="toggleSelectAll()">Select All</button>
      </div>

      <!-- Media List -->
      <div class="feed-container" id="media-list-container"></div>

      <!-- Load More Button -->
      <button class="btn-load-more" id="btn-load-more" onclick="loadMoreBatch()" style="display: none;">
        ⬇ Load Next 50 Files
      </button>
    </div>
  </main>

  <!-- Mobile Floating Bottom Action Dock -->
  <div class="floating-dock" id="floating-dock">
    <div class="dock-left-count">
      <span class="dock-title"><span id="dock-selected-num">0</span> files selected</span>
      <span class="dock-sub">Streams directly to Saved Messages</span>
    </div>
    <button class="dock-btn" onclick="forwardBatchSelected()">
      <span>⚡ Send Now</span>
    </button>
  </div>

  <!-- Mobile Native Bottom Sheet Drawer -->
  <div class="sheet-backdrop" id="sheet-backdrop" onclick="onBackdropClick(event)">
    <div class="bottom-sheet">
      <div class="sheet-grabber"></div>
      <div class="sheet-head">
        <span class="sheet-title">Select Channel or Bot</span>
        <button class="sheet-close" onclick="closeDrawer()">✕</button>
      </div>

      <!-- Tabs -->
      <div class="sheet-tabs">
        <div class="tab-pill active" onclick="switchFilter('all', this)">All (<span id="tab-cnt-all">0</span>)</div>
        <div class="tab-pill" onclick="switchFilter('restricted', this)">🔒 Restricted (<span id="tab-cnt-res">0</span>)</div>
        <div class="tab-pill" onclick="switchFilter('channel', this)">📢 Channels (<span id="tab-cnt-chan">0</span>)</div>
        <div class="tab-pill" onclick="switchFilter('bot', this)">🤖 Bots (<span id="tab-cnt-bot">0</span>)</div>
      </div>

      <!-- Search in Drawer -->
      <div class="sheet-search-wrap">
        <input type="text" id="drawer-search-input" class="search-input" style="padding-left: 16px;" placeholder="Search your chats..." oninput="renderDrawerChats()">
      </div>

      <!-- Scrollable List -->
      <div class="sheet-scroll-list" id="drawer-chats-list">
        <div style="text-align:center; padding: 30px; color: var(--text-muted);">Loading chats...</div>
      </div>
    </div>
  </div>

  <!-- Toast Alert -->
  <div class="mobile-toast" id="app-toast">
    <div class="toast-spinner"></div>
    <span id="toast-message-text">Streaming media...</span>
  </div>

  <script>
    let rawChats = [];
    let currentFilter = 'all';
    let activeChat = null;
    let nextOffsetId = 0;
    let loadedMessages = [];
    let selectedMsgIds = new Set();
    let searchDebounceTimer = null;

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/static/sw.js');
    }

    async function init() {
      try {
        const res = await fetch('/api/status');
        const data = await res.json();
        if (data.user) {
          document.getElementById('user-status-text').innerText = data.user;
        }
        await loadAllChats();
      } catch (e) {
        document.getElementById('user-status-text').innerText = 'Offline';
      }
    }

    async function loadAllChats() {
      try {
        const res = await fetch('/api/chats');
        rawChats = await res.json();

        document.getElementById('tab-cnt-all').innerText = rawChats.length;
        document.getElementById('tab-cnt-res').innerText = rawChats.filter(c => c.restricted).length;
        document.getElementById('tab-cnt-chan').innerText = rawChats.filter(c => c.type === 'Channel' || c.type === 'Supergroup').length;
        document.getElementById('tab-cnt-bot').innerText = rawChats.filter(c => c.type === 'User').length;

        renderDrawerChats();

        // Auto-select first restricted chat if available
        const firstRestricted = rawChats.find(c => c.restricted);
        if (firstRestricted && !activeChat) {
          selectChat(firstRestricted);
        }
      } catch (e) {
        document.getElementById('drawer-chats-list').innerHTML = '<div style="text-align:center; padding: 20px; color: var(--text-muted);">Failed to load chats</div>';
      }
    }

    function renderDrawerChats() {
      const list = document.getElementById('drawer-chats-list');
      const query = (document.getElementById('drawer-search-input').value || '').toLowerCase();

      const filtered = rawChats.filter(c => {
        const matchesQuery = c.title.toLowerCase().includes(query);
        if (!matchesQuery) return false;
        if (currentFilter === 'restricted') return c.restricted;
        if (currentFilter === 'channel') return c.type === 'Channel' || c.type === 'Supergroup';
        if (currentFilter === 'bot') return c.type === 'User';
        return true;
      });

      if (filtered.length === 0) {
        list.innerHTML = '<div style="text-align:center; padding: 30px; color: var(--text-muted);">No chats found</div>';
        return;
      }

      list.innerHTML = '';
      filtered.forEach(c => {
        const item = document.createElement('div');
        item.className = 'sheet-chat-item';
        item.onclick = () => selectChat(c);

        const initial = (c.title || '?').charAt(0).toUpperCase();
        item.innerHTML = `
          <div class="sheet-chat-avatar">${initial}</div>
          <div style="flex:1; min-width:0;">
            <div class="sheet-chat-title">
              <span>${c.title}</span>
              ${c.restricted ? '<span class="badge-lock">🔒 Restricted</span>' : ''}
            </div>
            <div class="sheet-chat-sub">${c.type}</div>
          </div>
        `;
        list.appendChild(item);
      });
    }

    function switchFilter(type, el) {
      currentFilter = type;
      document.querySelectorAll('.sheet-tabs .tab-pill').forEach(p => p.classList.remove('active'));
      el.classList.add('active');
      renderDrawerChats();
    }

    function openDrawer() {
      document.getElementById('sheet-backdrop').style.display = 'flex';
      document.getElementById('drawer-search-input').focus();
    }

    function closeDrawer() {
      document.getElementById('sheet-backdrop').style.display = 'none';
    }

    function onBackdropClick(e) {
      if (e.target.id === 'sheet-backdrop') closeDrawer();
    }

    function selectChat(chat) {
      activeChat = chat;
      document.getElementById('active-chat-avatar').innerText = (chat.title || '?').charAt(0).toUpperCase();
      document.getElementById('active-chat-title').innerHTML = `${chat.title} ${chat.restricted ? '<span class="badge-lock">🔒 Restricted</span>' : ''}`;
      document.getElementById('active-chat-sub').innerText = `${chat.type} • ID: ${chat.id}`;
      closeDrawer();
      document.getElementById('media-feed-wrapper').style.display = 'block';
      reloadMediaList();
    }

    async function reloadMediaList() {
      nextOffsetId = 0;
      loadedMessages = [];
      selectedMsgIds.clear();
      updateDockUI();
      document.getElementById('media-list-container').innerHTML = '';
      await fetchNextBatch();
    }

    function onSearchChanged() {
      clearTimeout(searchDebounceTimer);
      searchDebounceTimer = setTimeout(() => {
        reloadMediaList();
      }, 350);
    }

    async function fetchNextBatch() {
      if (!activeChat) return;
      showToast('Loading media files...');
      const search = document.getElementById('media-search-input').value.trim();
      const loadBtn = document.getElementById('btn-load-more');
      loadBtn.disabled = true;

      try {
        const res = await fetch(`/api/messages?chat_id=${activeChat.id}&limit=50&offset_id=${nextOffsetId}&search=${encodeURIComponent(search)}`);
        const data = await res.json();
        
        const newItems = data.messages || [];
        nextOffsetId = data.next_offset_id || 0;

        newItems.forEach(item => {
          if (!loadedMessages.some(m => m.id === item.id)) {
            loadedMessages.push(item);
            renderMediaCard(item);
          }
        });

        document.getElementById('feed-counter-label').innerText = `${loadedMessages.length} files loaded`;
        loadBtn.style.display = (data.has_more && nextOffsetId > 0) ? 'block' : 'none';

        if (loadedMessages.length === 0) {
          document.getElementById('media-list-container').innerHTML = '<div style="text-align:center; padding: 40px; color: var(--text-muted);">No media files found</div>';
        }
      } catch (e) {
        showToast('Error loading media');
      } finally {
        loadBtn.disabled = false;
        hideToast();
      }
    }

    function getMediaIcon(type) {
      if (type === 'audio') return '🎵';
      if (type === 'video') return '🎬';
      if (type === 'photo') return '🖼️';
      return '📄';
    }

    function renderMediaCard(m) {
      const container = document.getElementById('media-list-container');
      const card = document.createElement('div');
      card.className = 'media-card';
      card.id = `msg-card-${m.id}`;

      // Tap whole card to toggle selection
      card.onclick = (e) => {
        if (e.target.closest('.btn-quick-send')) return;
        toggleCardSelection(m.id);
      };

      card.innerHTML = `
        <div class="check-circle">
          <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"></polyline></svg>
        </div>
        <div class="media-type-icon ${m.type}">${getMediaIcon(m.type)}</div>
        <div class="media-meta-wrap">
          <div class="media-title">${m.filename}</div>
          <div class="media-info-row">
            <span class="tag-badge">${m.type.toUpperCase()}</span>
            <span>${m.size}</span>
            <span>${m.date}</span>
          </div>
        </div>
        <button class="btn-quick-send" onclick="sendSingleMedia(${m.id})">Send</button>
      `;
      container.appendChild(card);
    }

    function toggleCardSelection(id) {
      const card = document.getElementById(`msg-card-${id}`);
      if (selectedMsgIds.has(id)) {
        selectedMsgIds.delete(id);
        card.classList.remove('selected');
      } else {
        selectedMsgIds.add(id);
        card.classList.add('selected');
      }
      updateDockUI();
    }

    function toggleSelectAll() {
      const allSelected = selectedMsgIds.size === loadedMessages.length;
      loadedMessages.forEach(m => {
        const card = document.getElementById(`msg-card-${m.id}`);
        if (!card) return;
        if (allSelected) {
          selectedMsgIds.delete(m.id);
          card.classList.remove('selected');
        } else {
          selectedMsgIds.add(m.id);
          card.classList.add('selected');
        }
      });
      updateDockUI();
    }

    function updateDockUI() {
      const dock = document.getElementById('floating-dock');
      const count = selectedMsgIds.size;
      document.getElementById('dock-selected-num').innerText = count;

      if (count > 0) {
        dock.classList.add('visible');
      } else {
        dock.classList.remove('visible');
      }
    }

    function loadMoreBatch() {
      fetchNextBatch();
    }

    function showToast(text, persistent = false) {
      const toast = document.getElementById('app-toast');
      document.getElementById('toast-message-text').innerText = text;
      toast.style.display = 'flex';
      if (!persistent) {
        setTimeout(hideToast, 2200);
      }
    }

    function hideToast() {
      document.getElementById('app-toast').style.display = 'none';
    }

    async function sendSingleMedia(id) {
      showToast(`Streaming msg ${id} directly to Saved Messages...`, true);
      try {
        const res = await fetch('/api/forward', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({
            source_chat: activeChat.id,
            message_ids: [id]
          })
        });
        const data = await res.json();
        if (data.success) {
          showToast('✅ Sent to Saved Messages!');
        } else {
          alert('Failed: ' + (data.error || 'Server error'));
          hideToast();
        }
      } catch (e) {
        alert('Network error while streaming');
        hideToast();
      }
    }

    async function forwardBatchSelected() {
      const ids = Array.from(selectedMsgIds);
      if (ids.length === 0) return;
      if (!confirm(`Stream ${ids.length} files directly to Saved Messages?`)) return;

      showToast(`Streaming ${ids.length} files in RAM...`, true);
      try {
        const res = await fetch('/api/forward', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({
            source_chat: activeChat.id,
            message_ids: ids
          })
        });
        const data = await res.json();
        if (data.success) {
          showToast(`✅ Successfully sent ${data.count} files!`);
          selectedMsgIds.clear();
          document.querySelectorAll('.media-card.selected').forEach(c => c.classList.remove('selected'));
          updateDockUI();
        } else {
          alert('Failed: ' + (data.error || 'Server error'));
          hideToast();
        }
      } catch (e) {
        alert('Network error while streaming');
        hideToast();
      }
    }

    window.onload = init;
  </script>
</body>
</html>
